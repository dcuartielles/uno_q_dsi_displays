name: patches apply

# The single most likely way this repo breaks is Arduino publishing a kernel
# whose driver sources no longer match our patch anchors. The tools then exit
# with "anchor not found" and every new install fails.
#
# install-matrix.py catches exactly that, needs no hardware, and takes seconds.
# Running it weekly means we find out before a user does.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'      # Mondays, so a kernel bump is caught within a week
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patches apply and are idempotent on every shipped kernel
        run: python bench/install-matrix.py

      - name: Shell scripts parse
        run: |
          for f in install.sh uninstall.sh update.sh scripts/*.sh lib/*.sh                    tools/*.sh bench/*.sh bench/board/*.sh; do
            [ -e "$f" ] || continue
            sh -n "$f" || exit 1
          done
          echo "all shell scripts OK"

      - name: No stray control characters in scripts
        # Writing sed backreferences through a shell heredoc has repeatedly
        # eaten a backslash, after which Python read the remainder as an octal
        # escape and wrote a literal 0x01 into the script. It stays valid shell,
        # so `sh -n` passes and the damage only shows up at runtime as invalid
        # JSON or a silently broken command.
        #
        # The check is written in Python on purpose. Expressed as a grep pattern
        # it had to contain the control characters it was looking for, which
        # made this guard the one file in the repository most likely to be
        # silently disabled by an editor that normalises them - and it was.
        run: |
          python - <<'PY'
          import glob, sys
          allowed = {0x09, 0x0a, 0x0d}
          bad = []
          for pat in ("install.sh", "uninstall.sh", "update.sh", "scripts/*.sh",
                      "lib/*.sh", "tools/*.sh", "tools/*.py", "bench/*.sh",
                      "bench/board/*.sh", "bench/*.py", "panels/*.panel",
                      ".github/workflows/*.yml"):
              for f in glob.glob(pat):
                  data = open(f, "rb").read()
                  hits = sorted({b for b in data if b < 0x20 and b not in allowed})
                  if hits:
                      bad.append((f, [hex(h) for h in hits]))
          for f, hits in bad:
              print("control characters in %s: %s" % (f, ", ".join(hits)))
          sys.exit(1 if bad else 0)
          PY
          echo "no stray control characters"

      - name: Documentation agrees with the measurements
        # The docs quote precise figures, which makes a stale one more
        # dangerous than a missing one - people believe it. This recomputes
        # them from bench/results and fails if any document has drifted.
        run: python tools/check-docs.py

      - name: Python tools parse
        run: |
          for f in tools/*.py bench/*.py; do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1
          done
          echo "all python tools OK"
